<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Subsidi TransJogja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-blue-900 text-white flex flex-col">
            <div class="p-6">
                <h1 class="text-xl font-bold">TransJogja</h1>
                <p class="text-blue-300 text-sm">Subsidy Manager 2026</p>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="#" class="block px-4 py-2 bg-blue-800 rounded-lg">Data Transaksi</a>
                <a href="#" class="block px-4 py-2 hover:bg-blue-800 rounded-lg transition">Rekapitulasi</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white border-b px-8 py-4 flex justify-between items-center">
                <h2 class="text-xl font-semibold">Data Pengajuan Subsidi</h2>
            </header>

            <div class="flex-1 overflow-auto p-8 flex gap-6">
                <!-- Form Input -->
                <div class="w-1/3 bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
                    <h3 class="text-lg font-semibold mb-4 border-b pb-2">Input Item Baru</h3>
                    <form id="subsidyForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Periode & Kategori</label>
                            <div class="flex gap-2">
                                <input type="month" id="periode" class="w-1/2 p-2 border rounded" required>
                                <select id="kategori" class="w-1/2 p-2 border rounded">
                                    <option>BIAYA OPERASIONAL</option>
                                    <option>PEMELIHARAAN</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-1">Detail Poin</label>
                            <select id="detailPoin" class="w-full p-2 border rounded">
                                <option>Asuransi Kendaraan</option>
                                <option>Biaya Keur</option>
                                <option>Biaya PKB (STNK)</option>
                                <option>Nilai Depresiasi Bus</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Usulan AMI (Rp)</label>
                                <input type="number" id="usulan" class="w-full p-2 border rounded" value="0">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Verifikasi (Rp)</label>
                                <input type="number" id="verifikasi" class="w-full p-2 border rounded" value="0">
                            </div>
                        </div>

                        <div class="bg-red-50 p-3 rounded-lg border border-red-100">
                            <label class="block text-sm font-semibold text-red-800 mb-1">Sisa Tidak Cair (Otomatis)</label>
                            <input type="number" id="sisa" class="w-full p-2 border rounded bg-white" readonly value="0">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1 text-blue-700">Diajukan Kembali</label>
                                <input type="number" id="diajukanKembali" class="w-full p-2 border border-blue-300 rounded" value="0">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1 text-gray-500">Hangus (Otomatis)</label>
                                <input type="number" id="hangus" class="w-full p-2 border rounded bg-gray-100" readonly value="0">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">
                            Simpan Item Pengajuan
                        </button>
                    </form>
                </div>

                <!-- Table Data -->
                <div class="w-2/3 bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col">
                    <div class="p-4 border-b">
                        <h3 class="font-semibold">Riwayat Transaksi (Database JSON)</h3>
                    </div>
                    <div class="overflow-auto p-0">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-gray-50 text-gray-600 sticky top-0">
                                <tr>
                                    <th class="py-3 px-4">ID & Periode</th>
                                    <th class="py-3 px-4">Poin Biaya</th>
                                    <th class="py-3 px-4 text-right">Usulan</th>
                                    <th class="py-3 px-4 text-right">Cair</th>
                                    <th class="py-3 px-4 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100">
                                <!-- Data rows will be injected by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
